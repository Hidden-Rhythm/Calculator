<!DOCTYPE html lang="en">
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#0a0773">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

        <title>Calculator!</title>
        
        <!--Linking CSS file-->
        <link rel="stylesheet" href="style.css">

        <!--Linking Google Font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">

        <!--Loading CSS file-->
        <link rel="icon" type="image/png" href="assets/icon.png">
    </head>
    <body>
        <!--Background music setup-->
        <img id="music-toggle" src="assets/buttons/music-off.png" alt="Music Toggle" class="music-btn" title="Toggle Music">
        <audio id="bg-music" src="assets/sounds/bg.mp3" preload="auto" loop></audio>
        
        <!--Main container storing calculator elements-->
        <div class="calculator-wrapper">

            <!--Loading button-click audio files-->
            <audio id="click" src="assets/sounds/click.mp3" preload="auto"></audio>
            <audio id="equals" src="assets/sounds/equals.mp3" preload="auto"></audio>
            <audio id="delete" src="assets/sounds/delete.mp3" preload="auto"></audio>
            <audio id="error" src="assets/sounds/error.mp3" preload="auto"></audio>
            <audio id="laugh" src="assets/sounds/laugh.mp3" preload="auto"></audio>
            <audio id="sidebar-toggle-click" src="assets/sounds/sidebar-click.mp3" preload="auto"></audio>

            <!--Container for screen sections (current and last 3 results)-->
            <div class="screens-container">
                <div class="screen curr-screen">
                    <div id="display">0</div>
                </div>
                <div class="screen old-screen old-screen-1">
                    <div id="old-display-1"></div>
                </div>
                <div class="screen old-screen old-screen-2">
                    <div id="old-display-2"></div>
                </div>
                <div class="screen old-screen old-screen-3">
                    <div id="old-display-3"></div>
                </div>
            </div>

            <!--Container for grid containing basic buttons-->
            <div class="base-buttons-grid">
                <button type="button" class="btn" data-value="(" title="Open Parenthesis">
                    (
                </button>
                <button type="button" class="btn" data-value=")" title="Close Parenthesis">
                    )
                </button>
                <button type="button" class="btn" data-value="sqrt" title="Square Root">
                    √
                </button>
                <button type="button" class="btn" data-value="+" title="Add">
                    +
                </button>
                <button type="button" class="btn" data-value="0" title="Zero">
                    0
                </button>
                <button type="button" class="btn" data-value="1" title="One">
                    1
                </button>
                <button type="button" class="btn" data-value="2" title="Two">
                    2
                </button>
                <button type="button" class="btn" data-value="-" title="Subtract">
                    −
                </button>
                <button type="button" class="btn" data-value="3" title="Three">
                    3
                </button>
                <button type="button" class="btn" data-value="4" title="Four">
                    4
                </button>
                <button type="button" class="btn" data-value="5" title="Five">
                    5
                </button>
                <button type="button" class="btn" data-value="*" title="Multiply">
                    ×
                </button>
                <button type="button" class="btn" data-value="6" title="Six">
                    6
                </button>
                <button type="button" class="btn" data-value="7" title="Seven">
                    7
                </button>
                <button type="button" class="btn" data-value="8" title="Eight">
                    8
                </button>
                <button type="button" class="btn" data-value="/" title="Divide">
                    ÷
                </button>
                <button type="button" class="btn" data-value="9" title="Nine">
                    9
                </button>
                <button type="button" class="btn" data-value="." title="Decimal Point">
                    .
                </button>
                <button type="button" class="btn" data-value="=" title="Equals">
                    =
                </button>
                <button type="button" class="btn" data-value="del" title="Delete">
                    DEL
                </button>
            </div>

            <!--Sidebar toggle button-->
            <button type="button" id="sidebar-toggle" class="sidebar-toggle" title="Toggle Scientific Mode">
                🔬 Scientific
            </button>

            <!--Container for sidebar animation-->
            <div class="sidebar" id="sidebar">
            </div>

            <!--Container for grid on sidebar containing scientific buttons-->
            <div class="sci-grid">
                <button type="button" class="btn" data-value="sin" title="Sine">
                    sin
                </button>
                <button type="button" class="btn" data-value="cos" title="Cosine">
                    cos
                </button>
                <button type="button" class="btn" data-value="tan" title="Tangent">
                    tan
                </button>
                <button type="button" class="btn" data-value="arcsin" title="Inverse Sine">
                    sin⁻¹
                </button>
                <button type="button" class="btn" data-value="arccos" title="Inverse Cosine">
                    cos⁻¹
                </button>
                <button type="button" class="btn" data-value="arctan" title="Inverse Tangent">
                    tan⁻¹
                </button>
                <button type="button" class="btn" data-value="log" title="Logarithm">
                    log
                </button>
                <button type="button" class="btn" data-value="e" title="Euler's Number">
                    e
                </button>
                <button type="button" class="btn" data-value="pi" title="Pi">
                    π
                </button>
                <button type="button" class="btn" data-value="10x" title="10 to the Power">
                    10ˣ
                </button>
                <button type="button" class="btn" data-value="yx" title="Y to the Power of X">
                    yˣ
                </button>
                <button type="button" class="btn heart-btn" title="Math Pun">
                    ❤️
                </button>
            </div>

            <!--Footer with credits-->
            <p class="watermark">Hidden</p>
        </div>

        <div class="social-icons">
            <a href="https://github.com/Hidden-Rhythm" title="Visit GitHub Profile">
                <img class="icon-img" src="assets/github-logo.png" alt="github">
            </a>  
        </div>

        <!--Linking JS file-->
        <script src="script.js"></script>
    </body>
</html>
